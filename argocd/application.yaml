apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: document-api
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/zerobsv/argoapi.git
    targetRevision: HEAD
    path: helm
    helm:
      values: |
        image:
          repository: YOUR_REGISTRY/document-api
          tag: "1.0.0"
  destination:
    server: https://kubernetes.default.svc
    namespace: document-api
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
